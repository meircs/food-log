@keyframes inr{from{transform:translateX(24px);opacity:.3}to{transform:none;opacity:1}}

html,body{margin:0;background:var(--bg);color:var(--ink);

label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}

.preview{background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin-top:12px;font-variant-numeric:tabular-nums}

  font-size:11px;line-height:18px;text-align:center;font-weight:700}
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(8px + var(--safe-b));z-index:6;display:flex;max-width:560px;margin:0 auto;padding:4px;border-radius:32px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:0 8px 28px rgba(0,0,0,.18);
}
nav.tabs button{flex:1;border:0;background:none;padding:6px 0 5px;font-size:10.5px;color:var(--muted);position:relative;border-radius:26px;transition:background .2s,color .2s}
nav.tabs button span{display:flex;justify-content:center;height:26px;align-items:center}
nav.tabs button.on{color:var(--ink);font-weight:650;background:var(--line)}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px)}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;
  padding:8px 16px calc(18px + var(--safe-b));animation:up .34s cubic-bezier(.2,.9,.25,1)}

.wkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}

.wkrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:5px 0}.wkdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.wksplit{display:grid;grid-template-columns:42px 52px 1fr 40px;gap:8px;align-items:center;margin:4px 0;font-variant-numeric:tabular-nums}.wksplit span:last-child{text-align:right}

.item[data-act]{-webkit-tap-highlight-color:transparent;transition:background .15s}.item[data-act]:active{background:var(--line)}
.hsec{margin-bottom:10px}
.plan{padding-top:12px}.plannext{margin-top:8px;display:flex;flex-direction:column;gap:2px}

.page{position:fixed;inset:0;z-index:15;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:radial-gradient(120% 55% at 50% 0%,var(--tint),transparent 70%) no-repeat,var(--bg);background-attachment:local;animation:pgin .28s cubic-bezier(.2,.9,.25,1);transition:transform .24s cubic-bezier(.2,.9,.25,1)}

.ptiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.ptile{background:var(--card);border-radius:16px;padding:10px 14px}

.pbatt:after{content:"";position:absolute;right:-12px;top:24px;width:8px;height:22px;border-radius:0 4px 4px 0;background:var(--line)}

.ptab{background:var(--card);border-radius:16px;padding:6px 14px;margin-top:8px}.ptrow{display:grid;grid-template-columns:64px 1fr 90px;align-items:center;gap:8px;padding:6px 0;font-size:14px}.ptrow+.ptrow{border-top:1px solid var(--line)}

.pjh{display:flex;align-items:center;gap:10px;margin-bottom:6px}.pjr{display:grid;grid-template-columns:92px 1fr 78px;gap:10px;align-items:center;padding:6px 0;font-size:14px}.pjr b{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.pjr .small{grid-column:2/4}
.pjbar{position:relative;height:8px;border-radius:4px;background:var(--line)}.pjbar:after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)}.pjbar i{position:absolute;top:0;bottom:0;border-radius:4px}
.pneed{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:10px 4px 2px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left}.pneed b{font-size:17px}.pneed .small{flex:1;text-align:right}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes bdin{from{background:rgba(0,0,0,0)}to{background:rgba(0,0,0,.35)}}
.backdrop{animation:bdin .25s ease}
.toast{position:fixed;left:50%;bottom:calc(150px + var(--safe-b));transform:translateX(-50%);z-index:30;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw}
